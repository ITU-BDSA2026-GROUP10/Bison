# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# See link for more: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
name: build and test with dotnet

on:
  push:
    branches:
      - main
      - dafnyWorkflow
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Setup Dafny
      uses: dafny-lang/setup-dafny-action@v1
      with:
        dafny-version: "4.11.0"

    - name: Compile dafny to c#
      run: dafny translate cs --include-runtime filter1.dfy
      working-directory: dafny/
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Test
      run: |
          export authentication:github:clientId="${{ secrets.GITHUBCLIENTID }}"
          export authentication:github:clientSecret="${{ secrets.GITHUBCLIENTSECRET }}"
          dotnet test --no-build --verbosity normal
